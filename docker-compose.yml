# Stellar Compact — local development services (board card E11-09).
#
# Only the PostgreSQL the backend needs to boot. The app itself is run from the
# host JVM (it needs Java 25 with --enable-preview; see scripts/run-backend.ps1).
#
# Host port is 5433 (not the default 5432) so it does not collide with a local
# Postgres install. The container still listens on 5432 internally.
#
#   docker compose up -d db      # start just the database
#   docker compose config        # validate this file without starting anything
#
services:
  db:
    image: postgres:16-alpine
    container_name: stellar-db
    environment:
      POSTGRES_USER: stellar
      POSTGRES_PASSWORD: stellar
      POSTGRES_DB: stellar
    ports:
      - "5433:5432"
    volumes:
      - stellar-db-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready returns 0 once the server accepts connections; the backend
      # scripts wait for this before launching the app so Flyway can migrate.
      test: ["CMD-SHELL", "pg_isready -U stellar -d stellar"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  stellar-db-data:
