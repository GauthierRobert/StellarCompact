canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;lastT=performance.now();Cam.vx=Cam.vy=0;canvas.setPointerCapture(e.pointerId);});

addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(dragging){const now=performance.now(),dt=Math.max(1,now-lastT)/1000,s=Cam.scaleT()*DPR,dxw=(e.clientX-lastX)*DPR/s,dyw=(e.clientY-lastY)*DPR/s;Cam.tx-=dxw;Cam.ty-=dyw;Cam.x-=dxw;Cam.y-=dyw;Cam.vx=-dxw/dt;Cam.vy=-dyw/dt;lastX=e.clientX;lastY=e.clientY;lastT=now;}});
canvas.addEventListener('wheel',e=>{e.preventDefault();const m=e.deltaMode===1?16:1;zoomTo(e.clientX,e.clientY,-e.deltaY*0.0016*m);},{passive:false});
let aSX,aSY,aW=null;
function zoomTo(sx,sy,dz){aSX=sx;aSY=sy;aW=Cam.s2w(sx,sy,false);Cam.tz=Math.max(Cam.ZMIN,Math.min(Cam.ZMAX,Cam.tz+dz));}
document.getElementById('zin').onclick=()=>zoomTo(innerWidth/2,innerHeight/2,1);
document.getElementById('zout').onclick=()=>zoomTo(innerWidth/2,innerHeight/2,-1);
// double-click dives toward the nearest star (auto-centres) — feels like "entering" a system
canvas.addEventListener('dblclick',e=>{
  const w=Cam.s2w(e.clientX,e.clientY,false);let best=null,bd=1e18;
  for(const st of STARS){const d=(st.x-w.x)**2+(st.y-w.y)**2;if(d<bd){bd=d;best=st;}}
  if(best){Cam.tx=best.x;Cam.ty=best.y;Cam.tz=Math.min(Cam.ZMAX,Math.max(Cam.tz+2.2,9));aW=null;}
});
let pinchD=0;
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(pinchD)zoomTo((e.touches[0].clientX+e.touches[1].clientX)/2,(e.touches[0].clientY+e.touches[1].clientY)/2,Math.log2(d/pinchD));pinchD=d;}},{passive:false});
canvas.addEventListener('touchend',()=>pinchD=0);

function hashId(i){let h=Math.imul(i^0x9e3779b9,2246822519);return((h^(h>>>15))>>>0)/4294967296;}
const ROUTE_COL={allied:'#4ad6a0',trade:'#ffcf73',contested:'#ff6b6b'};
let ROUTES=[];
function buildRoutes(){const cand=STARS.filter(s=>s.P);const out=[];for(let i=0;i<cand.length;i++){const a=cand[i];let b1=null,d1=1e18;for(let j=0;j<cand.length;j++){if(j===i)continue;const b=cand[j],d=(a.x-b.x)**2+(a.y-b.y)**2;if(d<d1){d1=d;b1=b;}}if(b1&&a.id<b1.id){const r=hashId(a.id*131+b1.id);out.push({a,b:b1,kind:r<0.5?'trade':r<0.8?'allied':'contested',len:Math.sqrt(d1)});}}return out;}
ROUTES=buildRoutes();

let hover=null,showRoutes=true,lastFrame=performance.now();
document.getElementById('toggleRoutes').onchange=e=>showRoutes=e.target.checked;

function frame(){
  const now=performance.now(),dt=Math.min(0.05,(now-lastFrame)/1000);lastFrame=now;
  if(Math.abs(Cam.tz-Cam.z)>1e-5){Cam.z=expEase(Cam.z,Cam.tz,15,dt);if(aW){const p=Cam.s2w(aSX,aSY,false);Cam.x+=aW.x-p.x;Cam.y+=aW.y-p.y;Cam.tx=Cam.x;Cam.ty=Cam.y;}}
  if(!dragging&&(Math.abs(Cam.vx)>1e-4||Math.abs(Cam.vy)>1e-4)){Cam.tx+=Cam.vx*dt;Cam.ty+=Cam.vy*dt;const d=Math.exp(-4.5*dt);Cam.vx*=d;Cam.vy*=d;if(Math.hypot(Cam.vx,Cam.vy)<0.002)Cam.vx=Cam.vy=0;}
  Cam.x=expEase(Cam.x,Cam.tx,18,dt);Cam.y=expEase(Cam.y,Cam.ty,18,dt);
  hover=null;
  ctx.fillStyle='#000308';ctx.fillRect(0,0,W,H);
  const s=Cam.scale()*DPR;
  drawNebula(s); drawDust(s);
  if(showRoutes)drawRoutes(s);
  drawStars(s);
  drawSystems(s);
  drawHUD(s);
  requestAnimationFrame(frame);
}

function drawNebula(s){
  const c=Cam.w2s(0,0),R=R_MAX*s;
  ctx.save();ctx.globalCompositeOperation='lighter';
  let g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,R);
  g.addColorStop(0,'rgba(90,100,170,0.10)');g.addColorStop(.2,'rgba(120,95,160,0.09)');g.addColorStop(.55,'rgba(50,70,150,0.035)');g.addColorStop(1,'rgba(20,40,110,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,c.y,R,0,7);ctx.fill();
  g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,R*0.14);
  g.addColorStop(0,'rgba(255,238,205,0.28)');g.addColorStop(1,'rgba(255,205,150,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,c.y,R*0.14,0,7);ctx.fill();
  ctx.restore();
}
function drawDust(s){
  if(s<0.0006)return;const fade=clamp01((0.02-s)/0.02); // dust mostly visible when zoomed out
  ctx.save();
  for(const d of DUST){
    ctx.globalAlpha=0.4*clamp01(s*900)* (0.4+0.6*fade);
    ctx.strokeStyle='rgba(8,5,16,0.9)';ctx.lineWidth=d.w*s;ctx.beginPath();let first=true;
    for(let t=0;t<=1.001;t+=0.05){const r=d.r*(0.6+0.8*t);const th=WIND*Math.log(Math.max(r,1)/R_MAX*4+1)+d.arm*(2*Math.PI/ARMS)+d.a*0.1;const p=Cam.w2s(Math.cos(th)*r,Math.sin(th)*r);if(first){ctx.moveTo(p.x,p.y);first=false;}else ctx.lineTo(p.x,p.y);}
    ctx.stroke();
  }
  ctx.restore();ctx.globalAlpha=1;
}

function drawStars(s){
  const now=performance.now()/1000;
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<STARS.length;i++){
    const st=STARS[i],p=Cam.w2s(st.x,st.y);
    if(p.x<-50||p.x>W+50||p.y<-50||p.y>H+50)continue;
    // size grows only gently with zoom so stars stay point-like (real look)
    const r=Math.max(0.55*DPR,(0.45+st.sz*0.55)*DPR*(0.85+Math.min(1.6,s*0.02)));
    const tw=0.88+0.12*Math.sin(now*1.6+st.id);
    const gr=r*4.2;
    let g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,gr);
    g.addColorStop(0,rgb(st.k,1));g.addColorStop(.25,rgb(st.k,.5));g.addColorStop(1,rgb(st.k,0));
    ctx.globalAlpha=(0.2+0.5*st.b)*tw;ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,gr,0,7);ctx.fill();
    // diffraction spikes only on the brightest, and only once they're sizable
    const spikeT=clamp01((st.b-0.6)/0.3)*clamp01((r-1.6*DPR)/2);
    if(spikeT>0.03){const L=gr*(2+st.g*1.6)*spikeT;ctx.globalAlpha=0.45*spikeT*tw;ctx.strokeStyle=rgb(st.k,1);ctx.lineWidth=Math.max(0.5,r*0.16);for(let a=0;a<4;a++){const ang=a*Math.PI/2;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+Math.cos(ang)*L,p.y+Math.sin(ang)*L);ctx.stroke();}}
    ctx.globalAlpha=Math.min(1,(0.55+st.b)*tw);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x,p.y,r*0.6,0,7);ctx.fill();
    const dx=mx*DPR-p.x,dy=my*DPR-p.y;if(dx*dx+dy*dy<Math.max(gr*gr,(10*DPR)**2))hover={x:p.x,y:p.y,st};
  }
  ctx.restore();ctx.globalAlpha=1;
}

/* PLANETS: only when a system is big on screen. detailA ramps 0->1 across a
   zoom band; below it, a system is just its star (as in real maps). */
function drawSystems(s){
  const detailA=clamp01((s-2.2)/3.5); if(detailA<=0.01)return;
  const now=performance.now()/1000;
  ctx.save();
  for(let i=0;i<STARS.length;i++){
    const st=STARS[i];if(!st.P)continue;
    const p=Cam.w2s(st.x,st.y);
    if(p.x<-300||p.x>W+300||p.y<-300||p.y>H+300)continue;
    for(const pl of st.P){
      const or=pl.o*18*s;                       // orbit radius in px, true to zoom
      if(or<14)continue;                        // too small to bother
      ctx.globalAlpha=detailA*0.3;ctx.strokeStyle='rgba(150,185,235,.5)';ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(p.x,p.y,or,0,7);ctx.stroke();
      const ang=pl.ph+now*pl.sp,Px=p.x+Math.cos(ang)*or,Py=p.y+Math.sin(ang)*or;
      const pr=Math.max(2*DPR,pl.r*2.4*DPR*Math.min(1.6,s*0.05))*detailA;
      if(pr<1.2)continue;
      const ldx=p.x-Px,ldy=p.y-Py,ll=Math.hypot(ldx,ldy)||1,lx=ldx/ll,ly=ldy/ll;
      if(pl.ring)drawRing(Px,Py,pr,pl.tilt,detailA,true);
      const pg=ctx.createRadialGradient(Px+lx*pr*0.5,Py+ly*pr*0.5,pr*0.1,Px,Py,pr);
      pg.addColorStop(0,bcol(pl.bi,1));pg.addColorStop(.5,bcol(pl.bi,0.82));pg.addColorStop(1,'rgba(3,5,10,1)');
      ctx.globalAlpha=detailA;ctx.fillStyle=pg;ctx.beginPath();ctx.arc(Px,Py,pr,0,7);ctx.fill();
      ctx.globalAlpha=detailA*0.55;const ag=ctx.createRadialGradient(Px,Py,pr*0.85,Px,Py,pr*1.18);ag.addColorStop(0,bcol(pl.bi,0));ag.addColorStop(.7,bcol(pl.bi,0.22));ag.addColorStop(1,bcol(pl.bi,0));ctx.fillStyle=ag;ctx.beginPath();ctx.arc(Px,Py,pr*1.18,0,7);ctx.fill();
      if(pl.bi===0){ctx.globalAlpha=detailA*0.5;ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(Px+lx*pr*0.4,Py+ly*pr*0.4,pr*0.16,0,7);ctx.fill();}
      if(pl.ring)drawRing(Px,Py,pr,pl.tilt,detailA,false);
      for(let m=0;m<pl.moons;m++){const ma=now*(0.6+m*0.4)+m*2,mor=pr*(1.9+m*0.7),Mx=Px+Math.cos(ma)*mor,My=Py+Math.sin(ma)*mor*0.5;ctx.globalAlpha=detailA;ctx.fillStyle='#cfd6e0';ctx.beginPath();ctx.arc(Mx,My,Math.max(1,pr*0.15),0,7);ctx.fill();}
      const dx=mx*DPR-Px,dy=my*DPR-Py;if(dx*dx+dy*dy<(pr+5*DPR)**2)hover={x:Px,y:Py,planet:pl,st};
    }
  }
  ctx.restore();ctx.globalAlpha=1;
}
function drawRing(cx,cy,pr,tilt,a,back){ctx.save();ctx.globalAlpha=a*0.7;ctx.translate(cx,cy);ctx.rotate(tilt);ctx.scale(1,0.32);ctx.lineWidth=pr*0.5;const g=ctx.createRadialGradient(0,0,pr*1.2,0,0,pr*2.1);g.addColorStop(0,'rgba(220,210,190,0)');g.addColorStop(.4,'rgba(220,210,190,.55)');g.addColorStop(.75,'rgba(180,170,150,.3)');g.addColorStop(1,'rgba(220,210,190,0)');ctx.strokeStyle=g;ctx.beginPath();ctx.arc(0,0,pr*1.65,back?Math.PI:0,back?2*Math.PI:Math.PI);ctx.stroke();ctx.restore();}

/* ROUTES: fade in only at mid zoom, thin, and SHORT lanes only when far
   (long cross-galaxy lines are what made the scribble). */
function drawRoutes(s){
  const a=clamp01((s-0.9)/1.0)*(1-clamp01((s-30)/24));
  if(a<=0.02)return;
  const now=performance.now()/1000;
  // when zoomed out, only show short local lanes; reveal longer ones as you zoom in
  const maxLen= 60 + 400*clamp01((s-1.0)/6);
  ctx.save();
  for(const rt of ROUTES){
    if(rt.len>maxLen)continue;
    const A=Cam.w2s(rt.a.x,rt.a.y),B=Cam.w2s(rt.b.x,rt.b.y),col=ROUTE_COL[rt.kind];
    ctx.globalAlpha=a*0.22;ctx.strokeStyle=col;ctx.lineWidth=1*DPR;if(rt.kind==='contested')ctx.setLineDash([5*DPR,5*DPR]);else ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();ctx.setLineDash([]);
    const f=(now*0.25)%1,fx=A.x+(B.x-A.x)*f,fy=A.y+(B.y-A.y)*f;ctx.globalAlpha=a*(0.9-Math.abs(f-0.5));ctx.fillStyle=col;ctx.beginPath();ctx.arc(fx,fy,1.8*DPR,0,7);ctx.fill();
  }
  ctx.restore();ctx.globalAlpha=1;
}

const SYL=['Vel','Ar','Ky','Tor','Zen','Lor','Eos','Nyx','Cae','Rho','Pyx','Vox','Tau','Sil','Dra','Mor','Hel','Qua'],CLS=['O','B','A','F','G','K','M'];
function starName(id){return SYL[(hashId(id*3)*SYL.length)|0]+SYL[(hashId(id*5)*SYL.length)|0].toLowerCase()+'-'+(((hashId(id*7)*900)|0)+100);}

function drawHUD(s){
  let lvl='GALAXY',sl='galaxy';
  if(s>5.5){lvl='SYSTEM';sl='~planetary';}else if(s>2.2){lvl='NEIGHBORHOOD';sl='~light-years';}else if(s>0.7){lvl='CLUSTER';sl='~cluster';}
  document.getElementById('lvl').textContent=lvl;document.getElementById('scaletxt').textContent=sl;
  document.getElementById('coords').textContent=Cam.x.toFixed(0)+' , '+Cam.y.toFixed(0);
  document.getElementById('zoom').textContent='x'+(s/Cam.fit()).toFixed(2);
  document.getElementById('panel').classList.toggle('show',s>0.9&&s<32);
  const tt=document.getElementById('tooltip');
  if(hover&&hover.planet){const pl=hover.planet;tt.style.opacity=1;tt.innerHTML='&#9673; '+starName(hover.st.id)+'<div class="sub">'+BIOMES[pl.bi]+(pl.ring?' &middot; ringed':'')+(pl.moons?' &middot; '+pl.moons+' moons':'')+'</div>';tt.style.left=(hover.x/DPR+14)+'px';tt.style.top=(hover.y/DPR-12)+'px';}
  else if(hover){const st=hover.st;tt.style.opacity=1;tt.innerHTML='&#9733; '+starName(st.id)+'<div class="sub">'+CLS[st.k]+'-type'+(st.g?' giant':'')+(st.P?' &middot; '+st.P.length+' planets':' &middot; no colonies')+'</div>';tt.style.left=(hover.x/DPR+14)+'px';tt.style.top=(hover.y/DPR-12)+'px';}
  else tt.style.opacity=0;
}
frame();
</script></body></html>
